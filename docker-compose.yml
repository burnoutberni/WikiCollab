services:
  app:
    build: .
    image: ghcr.io/burnoutberni/wikicollab:latest
    ports:
      - "3000:3000"
    volumes:
      - wikicollab-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/wikicollab.db
      # Update CORS_ORIGINS to your actual frontend domain(s), comma-separated.
      # Without this, WebSocket connections will be silently rejected with 403.
      - CORS_ORIGINS=https://your-domain.com
      # Wikimedia OAuth 2.0 + encrypted secrets (set real values at deploy time).
      - OAUTH_CONSUMER_KEY=${OAUTH_CONSUMER_KEY:?Set OAUTH_CONSUMER_KEY}
      - OAUTH_CONSUMER_SECRET=${OAUTH_CONSUMER_SECRET:?Set OAUTH_CONSUMER_SECRET}
      - OAUTH_CALLBACK_URL=${OAUTH_CALLBACK_URL:?Set OAUTH_CALLBACK_URL}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
    restart: unless-stopped

volumes:
  wikicollab-data:
