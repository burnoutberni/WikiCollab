packages:
  - "packages/*"

# Keep workspace links out of the buildpack-managed external virtual store.
hoistWorkspacePackages: false

minimumReleaseAge: 0

overrides:
  undici@<6.28.0: 8.12.3
  undici@>=7.0.0 <7.29.0: 8.12.3
  undici@>=8.0.0 <8.9.0: 8.12.4
  undici@>=8.9.0 <8.12.3: 8.12.3
  fast-uri@<3.1.7: 4.2.3
  fast-uri@>=3.1.7 <4.2.3: 4.2.3
  browserslist@<=4.28.6: 4.29.5
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  colord@<2.9.4: 2.10.0
  shell-quote@<1.8.5: 1.12.0
  handlebars@<4.7.10: 4.7.10
  postcss-selector-parser@<7.1.6: 7.1.7
  glob@>=9.0.0 <14.0.2: 14.0.3
  minimatch@<11.0.1: 11.0.1
  serialize-javascript@<7.1.3: 7.1.3
  source-map-js@<1.2.2: 1.2.2

allowBuilds:
  better-sqlite3: true
  esbuild: true

auditConfig:
  # No patched release exists upstream (deepmerge@4.3.1 is latest). Only
  # reachable through build-time tooling (workbox-build), never at runtime.
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
